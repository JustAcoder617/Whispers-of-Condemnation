name: Workflow de Compilação Automática

on: [push, pull_request]

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Processar arquivos .c
        # ESSA LINHA É A CHAVE: Ela impede que o erro pare o workflow
        continue-on-error: true
        run: |
          MSG_SECRETA="//no_compile"
          
          # Remove logs antigos se existirem
          rm -f erros_*.txt
          
          for arq in $(find . -name "*.c"); do
            echo "Analisando $arq..."
            if grep -q "$MSG_SECRETA" "$arq"; then
              echo "[SKIP] $arq ignorado."
            else
              echo "[BUILD] Compilando $arq..."
              # O '|| true' garante que o script continue mesmo se o gcc falhar
              gcc "$arq" -o "${arq%.c}.out" 2> "erros_${arq##*/}.txt" || true
              
              if [ -s "erros_${arq##*/}.txt" ]; then
                echo "[ERROR] Falha em $arq. Log criado."
              else
                rm -f "erros_${arq##*/}.txt"
                echo "[SUCCESS] $arq OK!"
              fi
            fi
          done

      - name: Commitar erros no repositório
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Verifica se existem arquivos de erro antes de tentar o git add
          if ls erros_*.txt 1> /dev/null 2>&1; then
            git add erros_*.txt
            git commit -m "docs: logs de erro de compilação [automático]"
            git push
          else
            echo "Nenhum erro encontrado para commitar."
          fi

      - name: Subir logs como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-de-erro-compilacao
          path: erros_*.txt
          if-no-files-found: ignore