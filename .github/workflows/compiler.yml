name: Workflow de Compilação Automática

on: [push, pull_request]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Processar arquivos .c
        run: |
          # Mensagem curta que você escolheu
          MSG_SECRETA="//no_compile"
          
          # Loop por todos os arquivos .c
          for arq in $(find . -name "*.c"); do
            echo "Analisando $arq..."
            
            # Checa a mensagem secreta
            if grep -q "$MSG_SECRETA" "$arq"; then
              echo "[SKIP] $arq contém a mensagem secreta. Pulando..."
            else
              echo "[BUILD] Tentando compilar $arq..."
              
              # O '|| true' faz o script continuar mesmo se a compilação falhar
              gcc "$arq" -o "${arq%.c}.out" 2> "erros_${arq##*/}.txt" || true
              
              # Verifica se o arquivo de erro tem conteúdo (se o GCC escreveu algo lá)
              if [ -s "erros_${arq##*/}.txt" ]; then
                echo "[ERROR] Falha na compilação de $arq. Verifique os logs nos Artifacts."
              else
                echo "[SUCCESS] $arq compilado com sucesso!"
                rm "erros_${arq##*/}.txt" 2>/dev/null || true
              fi
            fi
          done

      - name: Subir logs de erro
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-de-erro-compilacao
          # Ele vai pegar todos os erros_...txt que restaram
          path: erros_*.txt
          # Não deixa o workflow falhar se não houver nenhum erro para subir
          if-no-files-found: ignore