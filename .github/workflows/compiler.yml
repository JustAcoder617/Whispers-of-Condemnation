name: Workflow de Compilação Automática

on: [push, pull_request]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Processar arquivos .c
        # Esta linha garante que a bolinha fique VERDE mesmo se o GCC falhar
        continue-on-error: true 
        run: |
          MSG_SECRETA="//no_compile"
          
          for arq in $(find . -name "*.c"); do
            echo "Analisando $arq..."
            
            if grep -q "$MSG_SECRETA" "$arq"; then
              echo "[SKIP] $arq contém a mensagem secreta. Pulando..."
            else
              echo "[BUILD] Tentando compilar $arq..."
              
              # Tenta compilar e joga o erro para o txt
              gcc "$arq" -o "${arq%.c}.out" 2> "erros_${arq##*/}.txt" || true
              
              # Se o arquivo de erro existir e NÃO estiver vazio (-s)
              if [ -s "erros_${arq##*/}.txt" ]; then
                echo "[ERROR] Falha em $arq. Log gerado nos Artifacts."
              else
                echo "[SUCCESS] $arq compilado com sucesso!"
                # Remove o arquivo de erro vazio para não poluir o Artifact
                rm "erros_${arq##*/}.txt" 2>/dev/null || true
              fi
            fi
          done

      - name: Subir logs de erro
        # 'if: always()' garante que os logs subam mesmo se o passo anterior falhar
        if: always() 
        uses: actions/upload-artifact@v4
        with:
          name: logs-de-erro-compilacao
          path: erros_*.txt
          if-no-files-found: ignore