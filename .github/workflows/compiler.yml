name: Workflow de Compilação Automática

on: [push, pull_request]

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências do Sistema
        run: |
          sudo apt-get update
          # Aqui você adiciona as libs que seu RPG usa (curl, sqlite, etc)
          sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev

      - name: Processar arquivos .c com Super Auto-Linker
        continue-on-error: true
        run: |
          MSG_SECRETA="//no_compile"
          rm -f erros_*.txt
          
          for arq in $(find . -name "*.c"); do
            echo "Analisando $arq..."
            if grep -q "$MSG_SECRETA" "$arq"; then
              echo "[SKIP] $arq ignorado."
            else
              # --- MOTOR DE FLAGS ---
              FLAGS="-I. -I./mods"
              
              # Detecta CURL
              if grep -q "curl/curl.h" "$arq"; then FLAGS="$FLAGS -lcurl"; fi
              # Detecta Matemática
              if grep -q "math.h" "$arq"; then FLAGS="$FLAGS -lm"; fi
              # Detecta Threads
              if grep -q "pthread.h" "$arq"; then FLAGS="$FLAGS -pthread"; fi

              echo "[BUILD] Compilando $arq com flags: $FLAGS"
              
              gcc "$arq" $FLAGS -o "${arq%.c}.out" 2> "erros_${arq##*/}.txt" || true
              
              if [ -s "erros_${arq##*/}.txt" ]; then
                echo "[ERROR] Falha em $arq."
              else
                rm -f "erros_${arq##*/}.txt"
                echo "[SUCCESS] $arq OK!"
              fi
            fi
          done

      - name: Commitar erros no repositório
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Sincroniza para evitar o erro de 'divergent branches'
          git pull origin main --no-rebase || true
          
          if ls erros_*.txt 1> /dev/null 2>&1; then
            git add erros_*.txt
            git commit -m "docs: logs de erro de compilação [automático]"
            git push origin main || (git pull origin main --no-rebase && git push origin main)
          else
            echo "Nenhum erro encontrado."
          fi