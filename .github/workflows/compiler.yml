name: Workflow de Compilação Automática

on: [push, pull_request]

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libsqlite3-dev

      - name: Processar arquivos .c
        continue-on-error: true
        run: |
          MSG_SECRETA="//no_compile"
          rm -f erros_*.txt
          
          # 1. Lista todos os .c do projeto (menos os que têm a msg secreta)
          # Isso é importante para funções como 'avaliacao' que estão em outros arquivos
          ALL_SOURCES=$(find . -name "*.c" -exec grep -L "$MSG_SECRETA" {} +)
          
          for arq in $(find . -maxdepth 1 -name "*.c"); do
            # Pula se tiver a msg secreta
            if grep -q "$MSG_SECRETA" "$arq"; then
              echo "[SKIP] $arq ignorado."
              continue
            fi

            echo "Analisando $arq..."
            
            # --- MOTOR DE FLAGS ---
            # -I. faz o GCC achar seus headers em pastas como ./modularization
            FLAGS="-I. -lm -lcurl -pthread -lrt" 

            echo "[BUILD] Compilando $arq junto com as dependências locais..."
            
            # O SEGREDO: Compilar o arquivo atual + todos os outros .c válidos
            # Isso resolve o 'undefined reference'
            gcc "$arq" $ALL_SOURCES $FLAGS -o "${arq%.c}.out" 2> "erros_${arq##*/}.txt" || true
            
            if [ -s "erros_${arq##*/}.txt" ]; then
              echo "[ERROR] Falha em $arq."
            else
              rm -f "erros_${arq##*/}.txt"
              echo "[SUCCESS] $arq OK!"
            fi
          done

      - name: Commitar erros
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --no-rebase || true
          
          if ls erros_*.txt 1> /dev/null 2>&1; then
            git add erros_*.txt
            git commit -m "docs: logs de erro de compilação [automático]"
            git push origin main || (git pull origin main --no-rebase && git push origin main)
          else
            echo "Nenhum erro encontrado."
          fi